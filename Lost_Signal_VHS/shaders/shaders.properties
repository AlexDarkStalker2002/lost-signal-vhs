# Lost Signal VHS - Iris shader-pack configuration

# The pack keeps vanilla lighting but supplies explicit lightweight geometry
# passes. Iris 1.11.2 no longer guarantees a usable colortex0 fallback for a
# composite-only pack, so these passes capture the finished scene before the VHS
# post-processing chain. A shadow pass would still waste an extra world render.
shadow.enabled=false

# Minecraft's own vignette would stack with the adjustable camcorder vignette.
vignette=false

# Keep every read/write flip explicit so Iris versions cannot infer a conflicting
# swap for the temporal feedback chain. Minecraft 26.x must use OpenGL because
# Iris is not compatible with the experimental Vulkan backend.
flip.composite.colortex0=true
flip.composite.colortex4=false
flip.composite.colortex5=true
flip.composite1.colortex4=true
flip.composite1.colortex0=false
flip.composite1.colortex5=false

# Settings-screen layout.
