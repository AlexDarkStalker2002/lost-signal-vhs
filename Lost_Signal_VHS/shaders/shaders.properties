# Lost Signal VHS - Iris shader-pack configuration

# The pack only post-processes vanilla rendering, so a shadow pass would waste a
# complete extra world render and would not improve the VHS look.
shadow.enabled=false

# Minecraft's own vignette would stack with the adjustable camcorder vignette.
vignette=false

# Restore the original temporal feedback chain. This is the look intended for
# the dedicated Minecraft 1.21.4 / Iris 1.8.8 profile.
flip.composite.colortex0=true
flip.composite1.colortex4=true

# Settings-screen layout.
screen=<profile> <empty> [FORMAT] [TAPE] [CAMERA] [SIGNAL] [COLOR]
screen.columns=2
screen.FORMAT=VHS_4_3 ROUNDED_OVERSCAN VHS_OSD TAPE_SOFTNESS CHROMA_BLEED LUMA_RINGING BLACK_CRUSH COLOR_SATURATION HEAD_SWITCHING
screen.FORMAT.columns=2
screen.TAPE=NOISE_STRENGTH SCANLINE_STRENGTH GLITCH_FREQUENCY GLITCH_STRENGTH STATIC_FREQUENCY
screen.TAPE.columns=2
screen.CAMERA=CHROMA_AMOUNT LENS_DISTORTION FLICKER_STRENGTH FRAME_JITTER WOBBLE_STRENGTH MOTION_SMEAR GHOST_STRENGTH PIXEL_SCALE
screen.CAMERA.columns=2
screen.SIGNAL=YIQ_SIGNAL CHROMA_PHASE_ERROR AUTO_EXPOSURE EXPOSURE_PUMP_STRENGTH CHROMA_KILLER CHROMA_KILLER_STRENGTH VERTICAL_SYNC_GLITCH SYNC_GLITCH_FREQUENCY SYNC_GLITCH_STRENGTH CHROMA_PERSISTENCE CHROMA_PERSISTENCE_STRENGTH
screen.SIGNAL.columns=2
screen.COLOR=WASHOUT_STRENGTH TINT_STRENGTH VIGNETTE_STRENGTH HALATION_STRENGTH
screen.COLOR.columns=2

sliders=TAPE_SOFTNESS CHROMA_BLEED LUMA_RINGING BLACK_CRUSH COLOR_SATURATION HEAD_SWITCHING HALATION_STRENGTH NOISE_STRENGTH SCANLINE_STRENGTH GLITCH_FREQUENCY GLITCH_STRENGTH STATIC_FREQUENCY CHROMA_AMOUNT CHROMA_PHASE_ERROR LENS_DISTORTION FLICKER_STRENGTH FRAME_JITTER WOBBLE_STRENGTH MOTION_SMEAR GHOST_STRENGTH PIXEL_SCALE EXPOSURE_PUMP_STRENGTH CHROMA_KILLER_STRENGTH SYNC_GLITCH_FREQUENCY SYNC_GLITCH_STRENGTH CHROMA_PERSISTENCE_STRENGTH WASHOUT_STRENGTH TINT_STRENGTH VIGNETTE_STRENGTH

