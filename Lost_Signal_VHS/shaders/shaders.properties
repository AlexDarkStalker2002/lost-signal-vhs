# Lost Signal VHS - Iris shader-pack configuration

# The pack only post-processes vanilla rendering, so a shadow pass would waste a
# complete extra world render and would not improve the VHS look.
shadow.enabled=false

# Minecraft's own vignette would stack with the adjustable camcorder vignette.
vignette=false

# Composite programs normally ping-pong written attachments. These declarations
# document the two important flips: current output on 0, temporal history on 4.
flip.composite.colortex0=true
flip.composite1.colortex4=true

# Settings-screen layout.
screen=<profile> <empty> [TAPE] [CAMERA] [COLOR]
screen.columns=2
screen.TAPE=NOISE_STRENGTH SCANLINE_STRENGTH GLITCH_FREQUENCY GLITCH_STRENGTH STATIC_FREQUENCY
screen.TAPE.columns=2
screen.CAMERA=CHROMA_AMOUNT LENS_DISTORTION FLICKER_STRENGTH FRAME_JITTER WOBBLE_STRENGTH MOTION_SMEAR GHOST_STRENGTH PIXEL_SCALE
screen.CAMERA.columns=2
screen.COLOR=WASHOUT_STRENGTH TINT_STRENGTH VIGNETTE_STRENGTH
screen.COLOR.columns=2

sliders=NOISE_STRENGTH SCANLINE_STRENGTH GLITCH_FREQUENCY GLITCH_STRENGTH STATIC_FREQUENCY CHROMA_AMOUNT LENS_DISTORTION FLICKER_STRENGTH FRAME_JITTER WOBBLE_STRENGTH MOTION_SMEAR GHOST_STRENGTH PIXEL_SCALE WASHOUT_STRENGTH TINT_STRENGTH VIGNETTE_STRENGTH

# Presets. The default macro values match Found_Footage.
profile.Subtle=NOISE_STRENGTH:0.03 SCANLINE_STRENGTH:0.22 GLITCH_FREQUENCY:0.04 GLITCH_STRENGTH:4.0 STATIC_FREQUENCY:0.04 CHROMA_AMOUNT:1.0 LENS_DISTORTION:0.015 FLICKER_STRENGTH:0.020 FRAME_JITTER:0.4 WOBBLE_STRENGTH:1.0 MOTION_SMEAR:1.0 GHOST_STRENGTH:0.08 PIXEL_SCALE:1.5 WASHOUT_STRENGTH:0.22 TINT_STRENGTH:0.20 VIGNETTE_STRENGTH:0.32
profile.Found_Footage=NOISE_STRENGTH:0.10 SCANLINE_STRENGTH:0.38 GLITCH_FREQUENCY:0.16 GLITCH_STRENGTH:10.0 STATIC_FREQUENCY:0.14 CHROMA_AMOUNT:2.5 LENS_DISTORTION:0.025 FLICKER_STRENGTH:0.035 FRAME_JITTER:1.2 WOBBLE_STRENGTH:1.5 MOTION_SMEAR:1.5 GHOST_STRENGTH:0.13 PIXEL_SCALE:2.0 WASHOUT_STRENGTH:0.34 TINT_STRENGTH:0.30 VIGNETTE_STRENGTH:0.52
