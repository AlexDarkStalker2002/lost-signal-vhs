# Lost Signal VHS - Iris shader-pack configuration

# The pack only post-processes vanilla rendering, so a shadow pass would waste a
# complete extra world render and would not improve the VHS look.
shadow.enabled=false

# Minecraft's own vignette would stack with the adjustable camcorder vignette.
vignette=false

# Restore the original temporal feedback chain. The stable composite-buffer
# interface is shared by supported Iris releases on Minecraft 1.20.1 through
# 26.2. Minecraft 26.x must use its OpenGL graphics backend because Iris is not
# compatible with the experimental Vulkan backend.
flip.composite.colortex0=true
flip.composite1.colortex4=true

# Settings-screen layout.
screen=<profile> QUALITY_LEVEL [FORMAT] [TAPE] [GENERATION] [CAMERA] [CAMCORDER] [SIGNAL] [BROKEN] [LIMINAL] [COLOR]
screen.columns=2
screen.FORMAT=SIGNAL_STANDARD INTERLACED_FIELDS INTERLACE_STRENGTH VHS_4_3 ROUNDED_OVERSCAN VHS_OSD TAPE_SOFTNESS CHROMA_BLEED LUMA_RINGING BLACK_CRUSH COLOR_SATURATION HEAD_SWITCHING
screen.FORMAT.columns=2
screen.TAPE=NOISE_STRENGTH SCANLINE_STRENGTH TIMEBASE_ERROR GLITCH_FREQUENCY GLITCH_STRENGTH STATIC_FREQUENCY
screen.TAPE.columns=2
screen.GENERATION=TAPE_FORMAT GENERATION_LOSS TAPE_WEAR
screen.GENERATION.columns=2
screen.CAMERA=CHROMA_AMOUNT LENS_DISTORTION FLICKER_STRENGTH FRAME_JITTER WOBBLE_STRENGTH MOTION_SMEAR SPATIAL_ECHO SPATIAL_ECHO_STRENGTH PIXEL_SCALE
screen.CAMERA.columns=2
screen.CAMCORDER=CAMCORDER_ERA CAMCORDER_HUD DIGITAL_ZOOM FOCUS_HUNT_STRENGTH
screen.CAMCORDER.columns=2
screen.SIGNAL=YIQ_SIGNAL CHROMA_PHASE_ERROR GHOST_STRENGTH HISTORY_STABILIZATION AUTO_EXPOSURE EXPOSURE_PUMP_STRENGTH CHROMA_KILLER CHROMA_KILLER_STRENGTH VERTICAL_SYNC_GLITCH SYNC_GLITCH_FREQUENCY SYNC_GLITCH_STRENGTH CHROMA_PERSISTENCE CHROMA_PERSISTENCE_STRENGTH
screen.SIGNAL.columns=2
screen.BROKEN=TRACKING_CONTROL RF_INTERFERENCE_STRENGTH TAPE_CHEW_STRENGTH FRAME_REPEAT FRAME_REPEAT_FREQUENCY FRAME_REPEAT_STRENGTH
screen.BROKEN.columns=2
screen.LIMINAL=LIMINAL_MODE FLUORESCENT_FLICKER WHITE_BALANCE_DRIFT EXPOSURE_HUNT_STRENGTH LIMINAL_HAZE
screen.LIMINAL.columns=2
screen.COLOR=WASHOUT_STRENGTH TINT_STRENGTH VIGNETTE_STRENGTH HALATION_STRENGTH
screen.COLOR.columns=2

